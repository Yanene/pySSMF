site_name: pySSMF
site_description: Slave-spin mean-field theory for the Hubbard model
repo_url: https://github.com/yanene/pySSMF

theme:
  name: material

nav:
  - Home: index.md
  - Explanations:
      - Slave-spin theory: explanations/slave-spin-theory.md
  - References:
      - API: references/api.md

plugins:
  - search
  - bibtex: 
      bib_file: "docs/explanations/ref.bib"
      csl_file: "docs/ieee.csl"
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

markdown_extensions:
  - footnotes
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/extra.css
